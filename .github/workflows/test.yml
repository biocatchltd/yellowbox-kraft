name: Test and lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.11', '3.12']
    steps:
    - uses: actions/checkout@v3
    - name: Install poetry
      run: |
        python -m pip install pip --upgrade
        pip install poetry
        poetry config virtualenvs.prefer-active-python true
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: poetry update
    - name: Lint
      if: matrix.python-version == '3.11'
      run: poetry run sh scripts/lint.sh
    - name: Tests
      run: poetry run sh scripts/coverage.sh
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  # Trial only. Do not merge. Builds the wupserver pair (librdkafka 2.15.0 and
  # confluent-kafka 2.15.0) on Python 3.15, then runs the yellowbox Kafka tests.
  try-python-315:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.15'
    - name: Install librdkafka 2.15
      run: |
        sudo mkdir -p /etc/apt/keyrings
        wget -qO - https://packages.confluent.io/clients/deb/archive.key | gpg --dearmor | sudo tee /etc/apt/keyrings/confluent.gpg >/dev/null
        . /etc/os-release
        case "$VERSION_ID" in
          22.04) suffix=ubu22 ;;
          24.04) suffix=ubu24 ;;
          26.04) suffix=ubu26 ;;
          *) echo "No Confluent librdkafka build for Ubuntu $VERSION_ID" >&2; exit 1 ;;
        esac
        printf 'Types: deb\nURIs: https://packages.confluent.io/clients/deb/\nSuites: %s\nComponents: main\nArchitectures: %s\nSigned-by: /etc/apt/keyrings/confluent.gpg\n' \
          "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/confluent-clients.sources >/dev/null
        sudo apt-get update
        sudo apt-get install -y gcc python3-dev \
          "librdkafka1=2.15.0-1.cflt~${suffix}" \
          "librdkafka++1=2.15.0-1.cflt~${suffix}" \
          "librdkafka-dev=2.15.0-1.cflt~${suffix}"
    - name: Install confluent-kafka 2.15.0 and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install 'confluent-kafka==2.15.0'
        python -m pip install 'yellowbox>=0.8.0' 'pytest>=8' 'pytest-asyncio>=0.21' pytest-cov coverage
        python -m pip install --no-deps -e .
        python -c 'import confluent_kafka; print(confluent_kafka.version())'
    - name: Run yellowbox Kafka tests
      run: python -m pytest tests/blackbox -q
